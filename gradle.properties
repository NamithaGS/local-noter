# Required: all dependencies here (AndroidX, Compose, Room, ...) are AndroidX artifacts,
# and checkDebugAarMetadata fails the build without this set.
android.useAndroidX=true

# Default daemon heap (512m) OOMs in mergeExtDexDebug on this project - Compose,
# Room, MLKit genai-summarization and the bundled vosk native libs push dexing
# past it. GitHub Actions runners have several GB free, so give the daemon more room.
org.gradle.jvmargs=-Xmx4096m
